<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabric Certification Practice Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:1.6rem;margin-bottom:4px;color:#fff}
.subtitle{color:#888;font-size:.85rem;margin-bottom:24px}
.card{background:#1a1d27;border:1px solid #2a2d3a;border-radius:12px;padding:24px;margin-bottom:16px}
.card h2{font-size:1.1rem;color:#fff;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .15s}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-secondary{background:#2a2d3a;color:#e0e0e0;border:1px solid #3a3d4a}.btn-secondary:hover{background:#3a3d4a}
.btn-success{background:#10b981;color:#fff}.btn-success:hover{background:#059669}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 14px;font-size:.8rem}
select,input[type=number]{background:#1a1d27;border:1px solid #3a3d4a;color:#e0e0e0;padding:8px 12px;border-radius:8px;font-size:.9rem}
label{display:block;margin-bottom:6px;font-size:.85rem;color:#aaa}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.hidden{display:none!important}

/* Question display */
.q-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.85rem;color:#aaa}
.q-progress .timer{color:#f59e0b;font-weight:600}
.q-number{font-size:.8rem;color:#888;margin-bottom:4px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:20px;color:#fff}
.q-options{display:flex;flex-direction:column;gap:10px}
.option{background:#1e2130;border:2px solid #2a2d3a;border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:12px;font-size:.9rem;line-height:1.5}
.option:hover{border-color:#3b82f6;background:#1e2540}
.option.selected{border-color:#3b82f6;background:#1e2540}
.option.correct{border-color:#10b981;background:#0a2e1f}
.option.wrong{border-color:#ef4444;background:#2e0a0a}
.option.disabled{cursor:default;pointer-events:none}
.opt-letter{width:28px;height:28px;border-radius:50%;background:#2a2d3a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.option.selected .opt-letter{background:#3b82f6;color:#fff}
.option.correct .opt-letter{background:#10b981;color:#fff}
.option.wrong .opt-letter{background:#ef4444;color:#fff}
.q-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.q-explain{background:#1e2130;border-left:3px solid #3b82f6;padding:12px 16px;margin-top:16px;border-radius:0 8px 8px 0;font-size:.85rem;color:#bbb;line-height:1.6}

/* Results */
.result-score{font-size:2.5rem;font-weight:700;text-align:center;margin:20px 0}
.result-score.pass{color:#10b981}.result-score.fail{color:#ef4444}
.result-bar{height:8px;background:#2a2d3a;border-radius:4px;overflow:hidden;margin-bottom:20px}
.result-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:#1e2130;padding:16px;border-radius:8px;text-align:center}
.stat .val{font-size:1.4rem;font-weight:700;color:#fff}.stat .lbl{font-size:.75rem;color:#888;margin-top:4px}

/* History */
.history-table{width:100%;border-collapse:collapse;font-size:.85rem}
.history-table th{text-align:left;padding:10px 12px;border-bottom:2px solid #2a2d3a;color:#888;font-weight:600}
.history-table td{padding:10px 12px;border-bottom:1px solid #1e2130}
.history-table tr:hover td{background:#1e2130}
.badge{padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-pass{background:#0a2e1f;color:#10b981}.badge-fail{background:#2e0a0a;color:#ef4444}
.badge-dp600{background:#1e2540;color:#3b82f6}.badge-dp700{background:#2a1e40;color:#a855f7}
.empty{color:#555;text-align:center;padding:40px;font-size:.9rem}

/* Nav */
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{padding:10px 20px;border:none;background:transparent;color:#888;font-size:.9rem;cursor:pointer;border-radius:8px 8px 0 0;font-weight:600}
.tab.active{background:#1a1d27;color:#fff;border-bottom:2px solid #3b82f6}
.tab:hover{color:#ccc}
@media(max-width:640px){.app{padding:12px}.card{padding:16px}.q-text{font-size:.95rem}.option{padding:12px}.row>*{min-width:100%}.row{flex-direction:column}.result-stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:12px}.stat .val{font-size:1.1rem}.tabs{gap:0}.tab{padding:10px 14px;font-size:.85rem}.q-actions{flex-direction:column}.q-actions .btn{width:100%}.history-table{font-size:.8rem}.history-table th,.history-table td{padding:8px 6px}.btn{padding:12px 20px}}
</style>
<script src="tests/dp600/dp600_module1.js"></script>
<script src="tests/dp600/dp600_module2.js"></script>
<script src="tests/dp600/dp600_module3.js"></script>
<script src="tests/dp600/dp600_module4.js"></script>
<script src="tests/dp600/dp600_module5.js"></script>
<script src="tests/dp600/dp600.js"></script>
<script src="tests/dp700/dp700_module1.js"></script>
<script src="tests/dp700/dp700_module2.js"></script>
<script src="tests/dp700/dp700_module3.js"></script>
<script src="tests/dp700/dp700_module4.js"></script>
<script src="tests/dp700/dp700_module5.js"></script>
<script src="tests/dp700/dp700_module6.js"></script>
<script src="tests/dp700/dp700.js"></script>
</head>
<body>
<div class="app" id="app">
  <a href="index.html" style="display:inline-block;margin-bottom:12px;padding:8px 16px;background:#1a1d27;border:1px solid #2a2e3a;border-radius:8px;color:#8b8fa3;text-decoration:none;font-size:14px;transition:all .2s">← Back to Menu</a>
  <!-- Setup Screen -->
  <div id="screen-setup">
    <h1>Fabric Certification Practice Test</h1>
    <p class="subtitle">DP-600 &amp; DP-700 Exam Questions</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('test')">Take Test</button>
      <button class="tab" onclick="switchTab('history')">History</button>
    </div>

    <div id="tab-test">
      <div class="card">
        <h2>Configure Test</h2>
        <div class="row" style="margin-bottom:16px">
          <div>
            <label>Certification</label>
            <select id="cert-select" onchange="updateModules()">
              <option value="dp600">DP-600</option>
              <option value="dp700">DP-700</option>
              <option value="both">Both</option>
            </select>
          </div>
          <div>
            <label>Module</label>
            <select id="module-select" onchange="updateModuleCount()">
              <option value="all">All Modules</option>
            </select>
          </div>
          <div>
            <label>Number of Questions</label>
            <select id="count-select">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="all">All</option>
            </select>
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn btn-primary" onclick="startTest()" style="width:100%">Start Test</button>
          </div>
        </div>
        <div id="module-count" style="font-size:.8rem;color:#666;margin-bottom:8px"></div>
        <div style="font-size:.8rem;color:#666">Questions are randomized. No time limit. Review answers at the end.</div>
      </div>
    </div>

    <div id="tab-history" class="hidden">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="margin:0">Test History</h2>
          <button class="btn btn-danger btn-sm" onclick="clearHistory()">Clear All</button>
        </div>
        <div id="history-content"></div>
      </div>
    </div>
  </div>

  <!-- Question Screen -->
  <div id="screen-test" class="hidden">
    <div class="card">
      <div class="q-progress">
        <span id="q-counter">Question 1 / 20</span>
        <span class="timer" id="q-timer">00:00</span>
      </div>
      <div class="q-number" id="q-cert"></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-options" id="q-options"></div>
      <div id="q-explain-box" class="hidden"></div>
      <div class="q-actions">
        <button class="btn btn-secondary" id="btn-skip" onclick="skipQuestion()">Skip</button>
        <button class="btn btn-primary hidden" id="btn-next" onclick="nextQuestion()">Next</button>
      </div>
    </div>
  </div>

  <!-- Results Screen -->
  <div id="screen-results" class="hidden">
    <div class="card">
      <h2>Test Complete</h2>
      <div class="result-score" id="res-score"></div>
      <div class="result-bar"><div class="result-bar-fill" id="res-bar"></div></div>
      <div class="result-stats">
        <div class="stat"><div class="val" id="res-correct">0</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="val" id="res-wrong">0</div><div class="lbl">Wrong</div></div>
        <div class="stat"><div class="val" id="res-time">0:00</div><div class="lbl">Time</div></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-primary" onclick="startTest()">Retake</button>
        <button class="btn btn-secondary" onclick="reviewAnswers()">Review Answers</button>
        <button class="btn btn-secondary" onclick="showSetup()">Back to Menu</button>
      </div>
    </div>
    <div id="res-review" class="hidden"></div>
  </div>
</div>

<script>

function updateModules(){
  const cert=document.getElementById('cert-select').value;
  const sel=document.getElementById('module-select');
  sel.innerHTML='<option value="all">All Modules</option>';
  const mods=cert==='dp600'?DP600_MODULES:cert==='dp700'?DP700_MODULES:[...DP600_MODULES,...DP700_MODULES];
  mods.forEach((m,i)=>{
    const v=cert==='both'?(i<5?'dp600_'+(i+1):'dp700_'+(i-4)):cert+'_'+(i+1);
    sel.innerHTML+='<option value="'+v+'">'+m+'</option>';
  });
  updateModuleCount();
}
function updateModuleCount(){
  const cert=document.getElementById('cert-select').value;
  const mod=document.getElementById('module-select').value;
  let pool=getPool(cert);
  if(mod!=='all'){
    const[certKey,modNum]=mod.split('_');
    pool=pool.filter(q=>q.cert===certKey.toUpperCase()&&q.module===parseInt(modNum));
  }
  document.getElementById('module-count').textContent=pool.length+' questions available';
}

function getPool(cert) {
  if (cert === 'dp600') return DP600_QUESTIONS.map(q => ({...q, cert: 'DP600'}));
  if (cert === 'dp700') return DP700_QUESTIONS.map(q => ({...q, cert: 'DP700'}));
  return [...DP600_QUESTIONS.map(q => ({...q, cert: 'DP600'})), ...DP700_QUESTIONS.map(q => ({...q, cert: 'DP700'}))];
}
;

let state = {
  questions: [],
  current: 0,
  answers: [],
  startTime: null,
  timerInterval: null,
  cert: '',
  module: '',
  count: 0,
  testHistory: JSON.parse(localStorage.getItem('fabricTestHistory') || '[]')
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
  if (tab === 'test') {
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('tab-test').classList.remove('hidden');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('tab-history').classList.remove('hidden');
    renderHistory();
  }
}

function startTest() {
  const cert = document.getElementById('cert-select').value;
  const mod = document.getElementById('module-select').value;
  const countVal = document.getElementById('count-select').value;
  let pool = getPool(cert);

  if (mod !== 'all') {
    const [certKey, modNum] = mod.split('_');
    pool = pool.filter(q => q.cert === certKey.toUpperCase() && q.module === parseInt(modNum));
  }

  pool = shuffle(pool);
  const count = countVal === 'all' ? pool.length : Math.min(parseInt(countVal), pool.length);
  state.questions = pool.slice(0, count);
  state.cert = cert;
  state.module = mod;
  state.count = count;
  state.current = 0;
  state.answers = new Array(count).fill(null);
  state.startTime = Date.now();

  document.getElementById('screen-setup').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-test').classList.remove('hidden');

  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(updateTimer, 1000);
  showQuestion();
}

function updateTimer() {
  const s = Math.floor((Date.now() - state.startTime) / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  document.getElementById('q-timer').textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function showQuestion() {
  const q = state.questions[state.current];
  document.getElementById('q-counter').textContent = `Question ${state.current + 1} / ${state.questions.length}`;
  const modLabel = q.cert === 'DP600' ? DP600_MODULES[q.module-1] : DP700_MODULES[q.module-1];
  document.getElementById('q-cert').textContent = q.cert ? `${q.cert.toUpperCase()} — ${modLabel}` : '';
  document.getElementById('q-text').textContent = q.text;

  const letters = ['A','B','C','D','E','F'];
  const optsHtml = q.options.map((opt, i) => `
    <div class="option" data-idx="${i}" onclick="selectOption(${i})">
      <span class="opt-letter">${letters[i]}</span>
      <span>${opt}</span>
    </div>
  `).join('');
  document.getElementById('q-options').innerHTML = optsHtml;

  document.getElementById('q-explain-box').classList.add('hidden');
  document.getElementById('q-explain-box').innerHTML = '';
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-skip').classList.remove('hidden');
}

function selectOption(idx) {
  if (state.answers[state.current] !== null) return;
  state.answers[state.current] = idx;

  const q = state.questions[state.current];
  const correct = q.correct;
  const opts = document.querySelectorAll('.option');
  opts.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === correct) o.classList.add('correct');
    if (i === idx && i !== correct) o.classList.add('wrong');
    if (i === idx) o.classList.add('selected');
  });

  if (idx !== correct && q.explanation) {
    const box = document.getElementById('q-explain-box');
    box.innerHTML = '<strong>Explanation:</strong> ' + q.explanation;
    box.classList.remove('hidden');
  }

  document.getElementById('btn-skip').classList.add('hidden');
  document.getElementById('btn-next').classList.remove('hidden');
  document.getElementById('btn-next').textContent = state.current < state.questions.length - 1 ? 'Next' : 'Finish';
}

function skipQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    showQuestion();
  }
}

function nextQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    showQuestion();
  } else {
    finishTest();
  }
}

function finishTest() {
  clearInterval(state.timerInterval);
  const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  let correct = 0, wrong = 0, unanswered = 0;
  state.questions.forEach((q, i) => {
    if (state.answers[i] === null) unanswered++;
    else if (state.answers[i] === q.correct) correct++;
    else wrong++;
  });

  const pct = Math.round((correct / state.questions.length) * 100);
  const pass = pct >= 70;

  document.getElementById('screen-test').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');
  document.getElementById('res-score').textContent = `${pct}%`;
  document.getElementById('res-score').className = `result-score ${pass ? 'pass' : 'fail'}`;
  const bar = document.getElementById('res-bar');
  bar.style.width = pct + '%';
  bar.style.background = pass ? '#10b981' : '#ef4444';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong + (unanswered > 0 ? ` (${unanswered} skipped)` : '');
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('res-time').textContent = `${m}:${String(s).padStart(2,'0')}`;

  const history = {
    id: Date.now(),
    date: new Date().toISOString(),
    cert: state.cert.toUpperCase(),
    module: state.module || 'all',
    total: state.questions.length,
    correct, wrong, unanswered,
    pct, pass,
    elapsed,
    answers: state.answers.map((a, i) => ({
      qIdx: i,
      text: state.questions[i].text,
      chosen: a,
      correct: state.questions[i].correct,
      options: state.questions[i].options,
      explanation: state.questions[i].explanation || '',
      isCorrect: a === state.questions[i].correct
    }))
  };
  state.testHistory.unshift(history);
  if (state.testHistory.length > 100) state.testHistory = state.testHistory.slice(0, 100);
  localStorage.setItem('fabricTestHistory', JSON.stringify(state.testHistory));

  document.getElementById('res-review').classList.add('hidden');
  reviewAnswers();
}

function reviewAnswers() {
  const rev = document.getElementById('res-review');
  rev.classList.remove('hidden');
  const letters = ['A','B','C','D','E','F'];
  let html = '<div class="card"><h2>Answer Review</h2>';
  state.testHistory[0].answers.forEach((a, i) => {
    const cls = a.isCorrect ? 'correct' : (a.chosen === null ? 'skipped' : 'wrong');
    const color = a.isCorrect ? '#10b981' : (a.chosen === null ? '#888' : '#ef4444');
    html += `<div style="margin-bottom:20px;padding:16px;background:#1e2130;border-radius:8px;border-left:3px solid ${color}">`;
    html += `<div style="font-size:.8rem;color:#888;margin-bottom:6px">Q${i+1} ${a.isCorrect ? '✓ Correct' : (a.chosen === null ? '⊘ Skipped' : '✗ Wrong')}</div>`;
    html += `<div style="margin-bottom:12px;line-height:1.5">${a.text}</div>`;
    a.options.forEach((opt, j) => {
      let style = 'padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:.85rem;';
      if (j === a.correct) style += 'background:#0a2e1f;color:#10b981;';
      else if (j === a.chosen && !a.isCorrect) style += 'background:#2e0a0a;color:#ef4444;text-decoration:line-through;';
      else style += 'color:#666;';
      html += `<div style="${style}">${letters[j]}. ${opt}</div>`;
    });
    if (a.explanation) {
      html += `<div style="margin-top:10px;padding:10px 12px;background:#1e2540;border-left:3px solid #3b82f6;border-radius:0 6px 6px 0;font-size:.82rem;color:#bbb;line-height:1.5">${a.explanation}</div>`;
    }
    html += '</div>';
  });
  html += '</div>';
  rev.innerHTML = html;
  rev.scrollIntoView({behavior:'smooth'});
}

function showSetup() {
  clearInterval(state.timerInterval);
  document.getElementById('screen-test').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-setup').classList.remove('hidden');
}

function renderHistory() {
  const el = document.getElementById('history-content');
  const h = state.testHistory;
  if (!h.length) { el.innerHTML = '<div class="empty">No tests taken yet.</div>'; return; }
  let html = '<table class="history-table"><thead><tr><th>Date</th><th>Cert</th><th>Module</th><th>Score</th><th>Result</th><th>Time</th><th></th></tr></thead><tbody>';
  h.forEach(t => {
    const d = new Date(t.date);
    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const m = Math.floor(t.elapsed / 60);
    const s = t.elapsed % 60;
    const certCls = t.cert === 'DP600' ? 'badge-dp600' : (t.cert === 'DP700' ? 'badge-dp700' : '');
    const modLabel = t.module && t.module !== 'all' ? t.module.replace('_',' ').toUpperCase() : 'All';
    html += `<tr>
      <td>${dateStr}</td>
      <td><span class="badge ${certCls}">${t.cert}</span></td>
      <td style="font-size:.8rem;color:#aaa">${modLabel}</td>
      <td><strong>${t.pct}%</strong> (${t.correct}/${t.total})</td>
      <td><span class="badge ${t.pass?'badge-pass':'badge-fail'}">${t.pass?'PASS':'FAIL'}</span></td>
      <td>${m}:${String(s).padStart(2,'0')}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="reviewHistory(${t.id})">Review</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function reviewHistory(id) {
  const test = state.testHistory.find(t => t.id === id);
  if (!test) return;
  const letters = ['A','B','C','D','E','F'];
  const modLabel = test.module && test.module !== 'all' ? test.module.replace('_',' ').toUpperCase() : 'All Modules';
  let html = `<div class="card"><h2>Review: ${test.cert} — ${modLabel} — ${test.pct}% (${new Date(test.date).toLocaleDateString()})</h2>`;
  test.answers.forEach((a, i) => {
    const color = a.isCorrect ? '#10b981' : (a.chosen === null ? '#888' : '#ef4444');
    html += `<div style="margin-bottom:20px;padding:16px;background:#1e2130;border-radius:8px;border-left:3px solid ${color}">`;
    html += `<div style="font-size:.8rem;color:#888;margin-bottom:6px">Q${i+1} ${a.isCorrect ? '✓ Correct' : (a.chosen === null ? '⊘ Skipped' : '✗ Wrong')}</div>`;
    html += `<div style="margin-bottom:12px;line-height:1.5">${a.text}</div>`;
    a.options.forEach((opt, j) => {
      let style = 'padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:.85rem;';
      if (j === a.correct) style += 'background:#0a2e1f;color:#10b981;';
      else if (j === a.chosen && !a.isCorrect) style += 'background:#2e0a0a;color:#ef4444;text-decoration:line-through;';
      else style += 'color:#666;';
      html += `<div style="${style}">${letters[j]}. ${opt}</div>`;
    });
    if (a.explanation) {
      html += `<div style="margin-top:10px;padding:10px 12px;background:#1e2540;border-left:3px solid #3b82f6;border-radius:0 6px 6px 0;font-size:.82rem;color:#bbb;line-height:1.5">${a.explanation}</div>`;
    }
    html += '</div>';
  });
  html += '<div style="text-align:center;margin-top:12px"><button class="btn btn-secondary" onclick="showSetup()">Back to Menu</button></div></div>';
  document.getElementById('tab-history').innerHTML = html;
}

function clearHistory() {
  if (confirm('Clear all test history?')) {
    state.testHistory = [];
    localStorage.removeItem('fabricTestHistory');
    renderHistory();
  }
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  updateModules();
  document.getElementById('module-select').addEventListener('change', updateModuleCount);
});
</script>
</body>
</html>
