<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabric Certification Practice Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:1.6rem;margin-bottom:4px;color:#fff}
.subtitle{color:#888;font-size:.85rem;margin-bottom:24px}
.card{background:#1a1d27;border:1px solid #2a2d3a;border-radius:12px;padding:24px;margin-bottom:16px}
.card h2{font-size:1.1rem;color:#fff;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .15s}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-secondary{background:#2a2d3a;color:#e0e0e0;border:1px solid #3a3d4a}.btn-secondary:hover{background:#3a3d4a}
.btn-success{background:#10b981;color:#fff}.btn-success:hover{background:#059669}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 14px;font-size:.8rem}
select,input[type=number]{background:#1a1d27;border:1px solid #3a3d4a;color:#e0e0e0;padding:8px 12px;border-radius:8px;font-size:.9rem}
label{display:block;margin-bottom:6px;font-size:.85rem;color:#aaa}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.hidden{display:none!important}

/* Question display */
.q-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.85rem;color:#aaa}
.q-progress .timer{color:#f59e0b;font-weight:600}
.q-number{font-size:.8rem;color:#888;margin-bottom:4px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:20px;color:#fff}
.q-options{display:flex;flex-direction:column;gap:10px}
.option{background:#1e2130;border:2px solid #2a2d3a;border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:12px;font-size:.9rem;line-height:1.5}
.option:hover{border-color:#3b82f6;background:#1e2540}
.option.selected{border-color:#3b82f6;background:#1e2540}
.option.correct{border-color:#10b981;background:#0a2e1f}
.option.wrong{border-color:#ef4444;background:#2e0a0a}
.option.disabled{cursor:default;pointer-events:none}
.opt-letter{width:28px;height:28px;border-radius:50%;background:#2a2d3a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.option.selected .opt-letter{background:#3b82f6;color:#fff}
.option.correct .opt-letter{background:#10b981;color:#fff}
.option.wrong .opt-letter{background:#ef4444;color:#fff}
.q-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.q-explain{background:#1e2130;border-left:3px solid #3b82f6;padding:12px 16px;margin-top:16px;border-radius:0 8px 8px 0;font-size:.85rem;color:#bbb;line-height:1.6}

/* Results */
.result-score{font-size:2.5rem;font-weight:700;text-align:center;margin:20px 0}
.result-score.pass{color:#10b981}.result-score.fail{color:#ef4444}
.result-bar{height:8px;background:#2a2d3a;border-radius:4px;overflow:hidden;margin-bottom:20px}
.result-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:#1e2130;padding:16px;border-radius:8px;text-align:center}
.stat .val{font-size:1.4rem;font-weight:700;color:#fff}.stat .lbl{font-size:.75rem;color:#888;margin-top:4px}

/* History */
.history-table{width:100%;border-collapse:collapse;font-size:.85rem}
.history-table th{text-align:left;padding:10px 12px;border-bottom:2px solid #2a2d3a;color:#888;font-weight:600}
.history-table td{padding:10px 12px;border-bottom:1px solid #1e2130}
.history-table tr:hover td{background:#1e2130}
.badge{padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-pass{background:#0a2e1f;color:#10b981}.badge-fail{background:#2e0a0a;color:#ef4444}
.badge-dp600{background:#1e2540;color:#3b82f6}.badge-dp700{background:#2a1e40;color:#a855f7}
.empty{color:#555;text-align:center;padding:40px;font-size:.9rem}

/* Nav */
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{padding:10px 20px;border:none;background:transparent;color:#888;font-size:.9rem;cursor:pointer;border-radius:8px 8px 0 0;font-weight:600}
.tab.active{background:#1a1d27;color:#fff;border-bottom:2px solid #3b82f6}
.tab:hover{color:#ccc}
@media(max-width:640px){.app{padding:12px}.card{padding:16px}.q-text{font-size:.95rem}.option{padding:12px}.row>*{min-width:100%}.row{flex-direction:column}.result-stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:12px}.stat .val{font-size:1.1rem}.tabs{gap:0}.tab{padding:10px 14px;font-size:.85rem}.q-actions{flex-direction:column}.q-actions .btn{width:100%}.history-table{font-size:.8rem}.history-table th,.history-table td{padding:8px 6px}.btn{padding:12px 20px}}
</style>
</head>
<body>
<div class="app" id="app">
  <a href="index.html" style="display:inline-block;margin-bottom:12px;padding:8px 16px;background:#1a1d27;border:1px solid #2a2e3a;border-radius:8px;color:#8b8fa3;text-decoration:none;font-size:14px;transition:all .2s">← Back to Menu</a>
  <!-- Setup Screen -->
  <div id="screen-setup">
    <h1>Fabric Certification Practice Test</h1>
    <p class="subtitle">DP-600 &amp; DP-700 Exam Questions</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('test')">Take Test</button>
      <button class="tab" onclick="switchTab('history')">History</button>
    </div>

    <div id="tab-test">
      <div class="card">
        <h2>Configure Test</h2>
        <div class="row" style="margin-bottom:16px">
          <div>
            <label>Certification</label>
            <select id="cert-select" onchange="updateModules()">
              <option value="dp600">DP-600</option>
              <option value="dp700">DP-700</option>
              <option value="both">Both</option>
            </select>
          </div>
          <div>
            <label>Module</label>
            <select id="module-select" onchange="updateModuleCount()">
              <option value="all">All Modules</option>
            </select>
          </div>
          <div>
            <label>Number of Questions</label>
            <select id="count-select">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="all">All</option>
            </select>
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn btn-primary" onclick="startTest()" style="width:100%">Start Test</button>
          </div>
        </div>
        <div id="module-count" style="font-size:.8rem;color:#666;margin-bottom:8px"></div>
        <div style="font-size:.8rem;color:#666">Questions are randomized. No time limit. Review answers at the end.</div>
      </div>
    </div>

    <div id="tab-history" class="hidden">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="margin:0">Test History</h2>
          <button class="btn btn-danger btn-sm" onclick="clearHistory()">Clear All</button>
        </div>
        <div id="history-content"></div>
      </div>
    </div>
  </div>

  <!-- Question Screen -->
  <div id="screen-test" class="hidden">
    <div class="card">
      <div class="q-progress">
        <span id="q-counter">Question 1 / 20</span>
        <span class="timer" id="q-timer">00:00</span>
      </div>
      <div class="q-number" id="q-cert"></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-options" id="q-options"></div>
      <div id="q-explain-box" class="hidden"></div>
      <div class="q-actions">
        <button class="btn btn-secondary" id="btn-skip" onclick="skipQuestion()">Skip</button>
        <button class="btn btn-primary hidden" id="btn-next" onclick="nextQuestion()">Next</button>
      </div>
    </div>
  </div>

  <!-- Results Screen -->
  <div id="screen-results" class="hidden">
    <div class="card">
      <h2>Test Complete</h2>
      <div class="result-score" id="res-score"></div>
      <div class="result-bar"><div class="result-bar-fill" id="res-bar"></div></div>
      <div class="result-stats">
        <div class="stat"><div class="val" id="res-correct">0</div><div class="lbl">Correct</div></div>
        <div class="stat"><div class="val" id="res-wrong">0</div><div class="lbl">Wrong</div></div>
        <div class="stat"><div class="val" id="res-time">0:00</div><div class="lbl">Time</div></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-primary" onclick="startTest()">Retake</button>
        <button class="btn btn-secondary" onclick="reviewAnswers()">Review Answers</button>
        <button class="btn btn-secondary" onclick="showSetup()">Back to Menu</button>
      </div>
    </div>
    <div id="res-review" class="hidden"></div>
  </div>
</div>

<script>
const DP600_MODULES = ["Module 1: Microsoft Fabric & Analytics Platform","Module 2: Data Storage & Transformation","Module 3: Semantic Modeling & DAX","Module 4: AI & Ontology","Module 5: Security & Governance"];
const DP700_MODULES = ["Module 1: Dataflows, Pipelines & Spark","Module 2: Lakehouse, Delta & Medallion","Module 3: Real-Time Intelligence","Module 4: Warehouse & Dimensional Modeling","Module 5: CI/CD & Administration","Module 6: Activator"];

function updateModules(){
  const cert=document.getElementById('cert-select').value;
  const sel=document.getElementById('module-select');
  sel.innerHTML='<option value="all">All Modules</option>';
  const mods=cert==='dp600'?DP600_MODULES:cert==='dp700'?DP700_MODULES:[...DP600_MODULES,...DP700_MODULES];
  mods.forEach((m,i)=>{
    const v=cert==='both'?(i<5?'dp600_'+(i+1):'dp700_'+(i-4)):cert+'_'+(i+1);
    sel.innerHTML+='<option value="'+v+'">'+m+'</option>';
  });
  updateModuleCount();
}
function updateModuleCount(){
  const cert=document.getElementById('cert-select').value;
  const mod=document.getElementById('module-select').value;
  let pool=getPool(cert);
  if(mod!=='all'){
    const[certKey,modNum]=mod.split('_');
    pool=pool.filter(q=>q.cert===certKey.toUpperCase()&&q.module===parseInt(modNum));
  }
  document.getElementById('module-count').textContent=pool.length+' questions available';
}

// Question data (extracted from JSON files)
const DP600_QUESTIONS = [
  {
    "text": "You have a Direct Lake semantic model connected to a lakehouse. A user runs a complex DAX query that scans millions of rows. The query takes longer than expected. You discover that the query fell back to DirectQuery mode. What is the PRIMARY reason this fallback occurred?",
    "options": [
      "The semantic model does not have an aggregation table defined",
      "The query exceeded the memory threshold for Direct Lake processing",
      "The lakehouse table is not in Delta format",
      "The user does not have ReadData permission on the lakehouse"
    ],
    "correct": 1,
    "module": 3
  },
  {
    "text": "You need to implement Row-Level Security on a warehouse so that regional managers only see sales data for their region. Which DAX expression should you use in the security filter for the DimRegion table?",
    "options": [
      "[Region] = USERNAME()",
      "[Region] = USERPRINCIPALNAME()",
      "[ManagerEmail] = USERPRINCIPALNAME()",
      "[Region] = LOOKUPVALUE(Users[Region], Users[Email], USERPRINCIPALNAME())"
    ],
    "correct": 2,
    "module": 5
  },
  {
    "text": "You have a semantic model with an inactive relationship between FactSales[OrderDate] and DimDate[Date]. You need to calculate total sales using the ship date instead of the order date in a specific measure. What should you use?",
    "options": [
      "CROSSFILTER to activate the relationship",
      "USERELATIONSHIP to specify the inactive relationship in the measure",
      "TREATAS to override the active relationship",
      "RELATEDTABLE to navigate the inactive relationship"
    ],
    "correct": 1,
    "module": 3
  },
  {
    "text": "A Power BI report uses a semantic model in Direct Lake mode. You import a new version of the semantic model to test. Which statement about the new import is TRUE?",
    "options": [
      "The new import will automatically replace the existing Direct Lake semantic model",
      "The new import creates a separate copy and does not affect the Direct Lake model until deployed",
      "The new import must use the same storage mode as the original",
      "The new import will cause the Direct Lake model to fall back to Import mode"
    ],
    "correct": 1,
    "module": 3
  },
  {
    "text": "You have a Fabric warehouse. A user with the Contributor workspace role needs to read specific columns from a table but must be denied access to a sensitive column containing salary data. Which security feature should you implement?",
    "options": [
      "Row-Level Security with a DAX filter on the salary column",
      "Column-Level Security using DENY SELECT on the salary column",
      "Dynamic Data Masking with the partial() function on the salary column",
      "Object-Level Security to hide the entire table from the user"
    ],
    "correct": 1,
    "module": 5
  },
  {
    "text": "You are building a Dataflow Gen2 that merges data from two different source systems. You notice that query folding is not occurring for the merge step. What is the MOST LIKELY reason?",
    "options": [
      "The merge uses an INNER JOIN instead of a LEFT JOIN",
      "The two sources are from different data source types",
      "The merge is performed after a filter step",
      "The dataflow uses the Modern Query Evaluator"
    ],
    "correct": 1,
    "module": 2
  },
  {
    "text": "You have a lakehouse with a Delta table containing 500 GB of data. You need to write a Spark notebook that performs a full outer join between this table and a dimension table, then writes the results to a new Delta table. Which write mode should you use to ensure the operation is idempotent?",
    "options": [
      "append mode",
      "overwrite mode",
      "merge mode",
      "update mode"
    ],
    "correct": 1,
    "module": 2
  },
  {
    "text": "A semantic model uses Import mode. You need to ensure that when the scheduled refresh fails, users can still see the last successfully loaded data rather than receiving an error. What should you configure?",
    "options": [
      "Enable query scaleout for the semantic model",
      "Set the refresh failure behavior to 'Use existing data'",
      "Configure composite mode with DirectQuery fallback",
      "Enable automatic aggregations on the model"
    ],
    "correct": 1,
    "module": 3
  },
  {
    "text": "You have a Fabric warehouse with a fact table and several dimension tables in a star schema. You need to create a measure that calculates the year-over-year growth of sales. Which DAX pattern is CORRECT?",
    "options": [
      "DIVIDE([Total Sales] - CALCULATE([Total Sales], SAMEPERIODLASTYEAR(DimDate[Date])), CALCULATE([Total Sales], SAMEPERIODLASTYEAR(DimDate[Date])))",
      "DIVIDE([Total Sales] - [Total Sales], CALCULATE([Total Sales], DATEADD(DimDate[Date], -1, YEAR)))",
      "[Total Sales] / CALCULATE([Total Sales], SAMEPERIODLASTYEAR(DimDate[Date])) - 1",
      "CALCULATE([Total Sales], YEAR(DimDate[Date]) = YEAR(TODAY()) - 1)"
    ],
    "correct": 0,
    "module": 3
  },
  {
    "text": "You need to implement Object-Level Security on a semantic model to restrict access to a table containing confidential product pricing. Users with the Viewer role should not be able to see the table or its columns. How should you configure OLS?",
    "options": [
      "Hide the table in Power BI Desktop and publish to the service",
      "Create a role in Tabular Editor that denies Read permission on the table",
      "Set the table's IsPrivate property to True in the model metadata",
      "Remove the table from the model's description and metadata"
    ],
    "correct": 1,
    "module": 3
  },
  {
    "text": "You have a Dataflow Gen2 that uses incremental refresh. The source table contains an 'UpdatedTimestamp' column. You configure the refresh to load data from the last 7 days. What happens when a record from 3 days ago is updated?",
    "options": [
      "The updated record is ignored because it was already loaded",
      "The updated record is loaded as a new row, creating a duplicate",
      "The refresh detects the timestamp change and replaces the existing record",
      "The refresh deletes the old record and inserts the new one"
    ],
    "correct": 2,
    "module": 2
  },
  {
    "text": "You have a semantic model with a many-to-many relationship between FactSales and DimProductCategory. A user creates a measure that sums sales amounts. Which behavior should you EXPECT when this measure is used in a report?",
    "options": [
      "Sales amounts are duplicated for each category in the relationship",
      "Sales amounts are correctly allocated to each category without duplication",
      "The measure returns an error due to the many-to-many relationship",
      "Sales amounts are averaged across all categories"
    ],
    "correct": 1,
    "module": 3
  },
  {
    "text": "You need to create a calculated column in a semantic model that classifies sales into 'High', 'Medium', or 'Low' based on the SalesAmount. The classification thresholds should be configurable by end users without modifying the model. What is the BEST approach?",
    "options": [
      "Create a calculated column using a hardcoded SWITCH statement",
      "Create a measure using SWITCH with a parameter table that users can modify",
      "Create a calculated column that references a separate threshold table using RELATED",
      "Create a calculated table that contains all possible combinations of thresholds and classifications"
    ],
    "correct": 1,
    "module": 3
  },
  {
    "text": "You have a Fabric lakehouse with a Delta table. You run a DELETE statement using T-SQL through the SQL analytics endpoint. What is the result?",
    "options": [
      "The rows are permanently removed from the Delta table",
      "The rows are marked as deleted in the Delta transaction log but not physically removed",
      "The statement fails because the SQL analytics endpoint is read-only",
      "The rows are removed from the SQL view but remain in the underlying Delta files"
    ],
    "correct": 2,
    "module": 2
  },
  {
    "text": "You are designing a dimensional model for a retail analytics solution. You have a DimCustomer table with SCD Type 2 tracking. A customer changes their address. How should you model this change?",
    "options": [
      "Update the existing row with the new address and set the previous address to NULL",
      "Insert a new row with the new address, set the old row's EndDate and IsCurrent flag, and set the new row's StartDate and IsCurrent flag",
      "Create a new DimCustomerAddress table and link it to the fact table",
      "Add a new column DimCustomer[Address2] to store the new address"
    ],
    "correct": 1,
    "module": 2
  },
  {
    "text": "You have a semantic model in Direct Lake mode. You add a new column to the underlying Delta table in the lakehouse. What happens to the semantic model?",
    "options": [
      "The new column automatically appears in the semantic model after the next refresh",
      "The new column is available immediately without any refresh action",
      "You must manually add the column to the semantic model in Power BI Desktop",
      "The semantic model must be reimported to recognize the new column"
    ],
    "correct": 1,
    "module": 3
  },
  {
    "text": "You need to implement dynamic Row-Level Security so that each user sees only data for their assigned business unit. You have a security table that maps users to business units. Which DAX expression correctly implements this?",
    "options": [
      "CONTAINS(Security, Security[User], USERPRINCIPALNAME(), Security[BusinessUnit], DimSales[BusinessUnit])",
      "LOOKUPVALUE(Security[BusinessUnit], Security[User], USERPRINCIPALNAME()) = DimSales[BusinessUnit]",
      "FILTER(DimSales, DimSales[BusinessUnit] = RELATED(Security[BusinessUnit]))",
      "DimSales[BusinessUnit] = CALCULATE(SELECTEDVALUE(Security[BusinessUnit]))"
    ],
    "correct": 0,
    "module": 3
  },
  {
    "text": "You have a Fabric warehouse with a fact table containing 10 billion rows. You need to optimize query performance by implementing aggregations. Which approach should you use?",
    "options": [
      "Create an aggregation table at the month level and configure it as a user-defined aggregation in the semantic model",
      "Create a materialized view at the month level in the warehouse",
      "Create a summarized table using a stored procedure that runs nightly",
      "Enable automatic aggregations on the warehouse"
    ],
    "correct": 0,
    "module": 3
  },
  {
    "text": "You have a Dataflow Gen2 that sources data from an on-premises SQL Server. The dataflow takes a long time to refresh. You discover that query folding is not occurring. Which transformation is MOST LIKELY causing the folding to break?",
    "options": [
      "Filtering rows based on a date column",
      "Selecting specific columns from the source table",
      "Adding a custom column that concatenates first and last names",
      "Sorting the data by a numeric column"
    ],
    "correct": 2,
    "module": 2
  },
  {
    "text": "You need to create a measure that calculates the percentage of total sales for each product category, but you want to exclude products with zero sales from the denominator. Which DAX expression should you use?",
    "options": [
      "DIVIDE([Total Sales], CALCULATE([Total Sales], DimProduct[Sales] > 0))",
      "DIVIDE([Total Sales], CALCULATE(SUM(FactSales[SalesAmount]), DimProduct[SalesAmount] > 0))",
      "DIVIDE([Total Sales], CALCULATE([Total Sales], FILTER(DimProduct, DimProduct[TotalSales] > 0)))",
      "DIVIDE([Total Sales], SUM(FactSales[SalesAmount]))"
    ],
    "correct": 2,
    "module": 3
  },
  {
    "text": "You have a semantic model with a date table. You create a measure that uses TOTALYTD to calculate year-to-date sales. The date table is marked as a date table. A user reports that the measure returns incorrect results when the fiscal year starts in April. What should you do?",
    "options": [
      "Use TOTALYTD with the year_end_date parameter set to '0430'",
      "Replace TOTALYTD with DATESYTD using the fiscal year end date",
      "Create a separate fiscal date table and use TOTALYTD with that table",
      "Use CALCULATE with DATESBETWEEN to manually define the fiscal year range"
    ],
    "correct": 0,
    "module": 3
  },
  {
    "text": "You have a Fabric warehouse. You need to implement column-level security to prevent a group of users from viewing the EmployeeSSN column. Which T-SQL statement should you execute?",
    "options": [
      "DENY SELECT ON Employees(EmployeeSSN) TO [SecurityGroup]",
      "ALTER COLUMN Employees.EmployeeSSN SET SECURITY POLICY",
      "CREATE SECURITY POLICY SSNFilter ADD FILTER PREDICATE",
      "ALTER TABLE Employees SET (RESULT_SET_CACHING = OFF)"
    ],
    "correct": 0,
    "module": 5
  },
  {
    "text": "You have a semantic model with Import mode. You need to implement a refresh strategy that loads only new and modified rows from the source. Which approach should you use?",
    "options": [
      "Configure incremental refresh with a filter on an UpdatedTimestamp column",
      "Schedule a full refresh every hour",
      "Use Dataflows Gen2 with append mode to add new rows",
      "Create a calculated column that identifies new rows and filter on it during refresh"
    ],
    "correct": 0,
    "module": 3
  },
  {
    "text": "You have a lakehouse with a Delta table. You need to optimize the file sizes for better query performance. The table currently has thousands of small files. Which command should you run?",
    "options": [
      "VACUUM table_name",
      "OPTIMIZE table_name",
      "REPAIR table_name",
      "ANALYZE table_name"
    ],
    "correct": 1,
    "module": 2
  },
  {
    "text": "You have a semantic model with a many-to-many relationship between FactSales and DimPromotion. You need to ensure that sales amounts are correctly attributed to promotions without double-counting. Which setting should you configure?",
    "options": [
      "Set the relationship cross-filter direction to both directions",
      "Enable 'Apply security filter in both directions' on the relationship",
      "Set the 'Is this relationship bidirectional' property to True",
      "Configure the relationship to use 'Assume referential integrity'"
    ],
    "correct": 0,
    "module": 3
  },
  {
    "text": "You need to create a measure that calculates the moving average of the last 3 months of sales. Which DAX pattern should you use?",
    "options": [
      "AVERAGEX(DATESINPERIOD(DimDate[Date], LASTDATE(DimDate[Date]), -3, MONTH), [Total Sales])",
      "CALCULATE(AVERAGE(FactSales[SalesAmount]), DATESINPERIOD(DimDate[Date], LASTDATE(DimDate[Date]), -3, MONTH))",
      "AVERAGEX(FILTER(ALL(DimDate), DimDate[Date] >= LASTDATE(DimDate[Date]) - 3), [Total Sales])",
      "MOVINGAVERAGE([Total Sales], 3, MONTH)"
    ],
    "correct": 0,
    "module": 3

function getPool(cert) {
  if (cert === 'dp600') return DP600_QUESTIONS.map(q => ({...q, cert: 'DP600'}));
  if (cert === 'dp700') return DP700_QUESTIONS.map(q => ({...q, cert: 'DP700'}));
  return [...DP600_QUESTIONS.map(q => ({...q, cert: 'DP600'})), ...DP700_QUESTIONS.map(q => ({...q, cert: 'DP700'}))];
}
;

let state = {
  questions: [],
  current: 0,
  answers: [],
  startTime: null,
  timerInterval: null,
  cert: '',
  module: '',
  count: 0,
  testHistory: JSON.parse(localStorage.getItem('fabricTestHistory') || '[]')
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
  if (tab === 'test') {
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('tab-test').classList.remove('hidden');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('tab-history').classList.remove('hidden');
    renderHistory();
  }
}

function startTest() {
  const cert = document.getElementById('cert-select').value;
  const mod = document.getElementById('module-select').value;
  const countVal = document.getElementById('count-select').value;
  let pool = getPool(cert);

  if (mod !== 'all') {
    const [certKey, modNum] = mod.split('_');
    pool = pool.filter(q => q.cert === certKey.toUpperCase() && q.module === parseInt(modNum));
  }

  pool = shuffle(pool);
  const count = countVal === 'all' ? pool.length : Math.min(parseInt(countVal), pool.length);
  state.questions = pool.slice(0, count);
  state.cert = cert;
  state.module = mod;
  state.count = count;
  state.current = 0;
  state.answers = new Array(count).fill(null);
  state.startTime = Date.now();

  document.getElementById('screen-setup').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-test').classList.remove('hidden');

  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(updateTimer, 1000);
  showQuestion();
}

function updateTimer() {
  const s = Math.floor((Date.now() - state.startTime) / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  document.getElementById('q-timer').textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function showQuestion() {
  const q = state.questions[state.current];
  document.getElementById('q-counter').textContent = `Question ${state.current + 1} / ${state.questions.length}`;
  const modLabel = q.cert === 'DP600' ? DP600_MODULES[q.module-1] : DP700_MODULES[q.module-1];
  document.getElementById('q-cert').textContent = q.cert ? `${q.cert.toUpperCase()} — ${modLabel}` : '';
  document.getElementById('q-text').textContent = q.text;

  const letters = ['A','B','C','D','E','F'];
  const optsHtml = q.options.map((opt, i) => `
    <div class="option" data-idx="${i}" onclick="selectOption(${i})">
      <span class="opt-letter">${letters[i]}</span>
      <span>${opt}</span>
    </div>
  `).join('');
  document.getElementById('q-options').innerHTML = optsHtml;

  document.getElementById('q-explain-box').classList.add('hidden');
  document.getElementById('q-explain-box').innerHTML = '';
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-skip').classList.remove('hidden');
}

function selectOption(idx) {
  if (state.answers[state.current] !== null) return;
  state.answers[state.current] = idx;

  const q = state.questions[state.current];
  const correct = q.correct;
  const opts = document.querySelectorAll('.option');
  opts.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === correct) o.classList.add('correct');
    if (i === idx && i !== correct) o.classList.add('wrong');
    if (i === idx) o.classList.add('selected');
  });

  document.getElementById('btn-skip').classList.add('hidden');
  document.getElementById('btn-next').classList.remove('hidden');
  document.getElementById('btn-next').textContent = state.current < state.questions.length - 1 ? 'Next' : 'Finish';
}

function skipQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    showQuestion();
  }
}

function nextQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    showQuestion();
  } else {
    finishTest();
  }
}

function finishTest() {
  clearInterval(state.timerInterval);
  const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  let correct = 0, wrong = 0, unanswered = 0;
  state.questions.forEach((q, i) => {
    if (state.answers[i] === null) unanswered++;
    else if (state.answers[i] === q.correct) correct++;
    else wrong++;
  });

  const pct = Math.round((correct / state.questions.length) * 100);
  const pass = pct >= 70;

  document.getElementById('screen-test').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');
  document.getElementById('res-score').textContent = `${pct}%`;
  document.getElementById('res-score').className = `result-score ${pass ? 'pass' : 'fail'}`;
  const bar = document.getElementById('res-bar');
  bar.style.width = pct + '%';
  bar.style.background = pass ? '#10b981' : '#ef4444';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong + (unanswered > 0 ? ` (${unanswered} skipped)` : '');
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('res-time').textContent = `${m}:${String(s).padStart(2,'0')}`;

  const history = {
    id: Date.now(),
    date: new Date().toISOString(),
    cert: state.cert.toUpperCase(),
    module: state.module || 'all',
    total: state.questions.length,
    correct, wrong, unanswered,
    pct, pass,
    elapsed,
    answers: state.answers.map((a, i) => ({
      qIdx: i,
      text: state.questions[i].text,
      chosen: a,
      correct: state.questions[i].correct,
      options: state.questions[i].options,
      isCorrect: a === state.questions[i].correct
    }))
  };
  state.testHistory.unshift(history);
  if (state.testHistory.length > 100) state.testHistory = state.testHistory.slice(0, 100);
  localStorage.setItem('fabricTestHistory', JSON.stringify(state.testHistory));

  document.getElementById('res-review').classList.add('hidden');
  reviewAnswers();
}

function reviewAnswers() {
  const rev = document.getElementById('res-review');
  rev.classList.remove('hidden');
  const letters = ['A','B','C','D','E','F'];
  let html = '<div class="card"><h2>Answer Review</h2>';
  state.testHistory[0].answers.forEach((a, i) => {
    const cls = a.isCorrect ? 'correct' : (a.chosen === null ? 'skipped' : 'wrong');
    const color = a.isCorrect ? '#10b981' : (a.chosen === null ? '#888' : '#ef4444');
    html += `<div style="margin-bottom:20px;padding:16px;background:#1e2130;border-radius:8px;border-left:3px solid ${color}">`;
    html += `<div style="font-size:.8rem;color:#888;margin-bottom:6px">Q${i+1} ${a.isCorrect ? '✓ Correct' : (a.chosen === null ? '⊘ Skipped' : '✗ Wrong')}</div>`;
    html += `<div style="margin-bottom:12px;line-height:1.5">${a.text}</div>`;
    a.options.forEach((opt, j) => {
      let style = 'padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:.85rem;';
      if (j === a.correct) style += 'background:#0a2e1f;color:#10b981;';
      else if (j === a.chosen && !a.isCorrect) style += 'background:#2e0a0a;color:#ef4444;text-decoration:line-through;';
      else style += 'color:#666;';
      html += `<div style="${style}">${letters[j]}. ${opt}</div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  rev.innerHTML = html;
  rev.scrollIntoView({behavior:'smooth'});
}

function showSetup() {
  clearInterval(state.timerInterval);
  document.getElementById('screen-test').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-setup').classList.remove('hidden');
}

function renderHistory() {
  const el = document.getElementById('history-content');
  const h = state.testHistory;
  if (!h.length) { el.innerHTML = '<div class="empty">No tests taken yet.</div>'; return; }
  let html = '<table class="history-table"><thead><tr><th>Date</th><th>Cert</th><th>Module</th><th>Score</th><th>Result</th><th>Time</th><th></th></tr></thead><tbody>';
  h.forEach(t => {
    const d = new Date(t.date);
    const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const m = Math.floor(t.elapsed / 60);
    const s = t.elapsed % 60;
    const certCls = t.cert === 'DP600' ? 'badge-dp600' : (t.cert === 'DP700' ? 'badge-dp700' : '');
    const modLabel = t.module && t.module !== 'all' ? t.module.replace('_',' ').toUpperCase() : 'All';
    html += `<tr>
      <td>${dateStr}</td>
      <td><span class="badge ${certCls}">${t.cert}</span></td>
      <td style="font-size:.8rem;color:#aaa">${modLabel}</td>
      <td><strong>${t.pct}%</strong> (${t.correct}/${t.total})</td>
      <td><span class="badge ${t.pass?'badge-pass':'badge-fail'}">${t.pass?'PASS':'FAIL'}</span></td>
      <td>${m}:${String(s).padStart(2,'0')}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="reviewHistory(${t.id})">Review</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function reviewHistory(id) {
  const test = state.testHistory.find(t => t.id === id);
  if (!test) return;
  const letters = ['A','B','C','D','E','F'];
  const modLabel = test.module && test.module !== 'all' ? test.module.replace('_',' ').toUpperCase() : 'All Modules';
  let html = `<div class="card"><h2>Review: ${test.cert} — ${modLabel} — ${test.pct}% (${new Date(test.date).toLocaleDateString()})</h2>`;
  test.answers.forEach((a, i) => {
    const color = a.isCorrect ? '#10b981' : (a.chosen === null ? '#888' : '#ef4444');
    html += `<div style="margin-bottom:20px;padding:16px;background:#1e2130;border-radius:8px;border-left:3px solid ${color}">`;
    html += `<div style="font-size:.8rem;color:#888;margin-bottom:6px">Q${i+1} ${a.isCorrect ? '✓ Correct' : (a.chosen === null ? '⊘ Skipped' : '✗ Wrong')}</div>`;
    html += `<div style="margin-bottom:12px;line-height:1.5">${a.text}</div>`;
    a.options.forEach((opt, j) => {
      let style = 'padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:.85rem;';
      if (j === a.correct) style += 'background:#0a2e1f;color:#10b981;';
      else if (j === a.chosen && !a.isCorrect) style += 'background:#2e0a0a;color:#ef4444;text-decoration:line-through;';
      else style += 'color:#666;';
      html += `<div style="${style}">${letters[j]}. ${opt}</div>`;
    });
    html += '</div>';
  });
  html += '<div style="text-align:center;margin-top:12px"><button class="btn btn-secondary" onclick="showSetup()">Back to Menu</button></div></div>';
  document.getElementById('tab-history').innerHTML = html;
}

function clearHistory() {
  if (confirm('Clear all test history?')) {
    state.testHistory = [];
    localStorage.removeItem('fabricTestHistory');
    renderHistory();
  }
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  updateModules();
  document.getElementById('module-select').addEventListener('change', updateModuleCount);
});
